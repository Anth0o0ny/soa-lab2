spring:
  application:
    name: soa-city-service
  cloud:
    consul:
      host: consul  # Имя сервиса Consul в Docker
      port: 8500    # Порт Consul
      discovery:
        instance-id: ${CONTAINER_NAME}  # Уникальный ID экземпляра
        service-name: city-service      # Имя сервиса в Consul
        hostname: ${CONTAINER_HOST}     # Хост сервиса
        port: 8443                      # Порт сервиса
        scheme: https                   # Протокол (http/https)
#        health-check-tls-skip-verify: true  # Пропустить проверку SSL
#  ssl:
#    bundle:
#      jks:
#        server:
#          key:
#            alias: city-service
#          keystore:
#            location: classpath:city-service.jks
#            password: admin_pass
#            type: PKCS12
#      pem:
#        client:
#          truststore:
#            certificate: classpath:city-service.crt
  ssl:
    bundle:
      jks:
        server:
          key:
            alias: city-service
          keystore:
            location: "classpath:city-service.jks"
            password: admin_pass
            type: PKCS12
#      pem:
#        client:
#          truststore:
#            certificate: "classpath:city-service.crt"

  datasource:
    url: jdbc:postgresql://localhost:5432/soa-db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8443
  servlet:
    context-path: /soa-backend-city-1.0-SNAPSHOT
  ssl:
    key-alias: city-service
    key-password: admin_pass
    key-store: classpath:city-service.jks
    key-store-password: admin_pass
    enabled: true
